name: Build signed Blokada 5 APK

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Build purpose
        required: true
        default: release-candidate
        type: choice
        options:
          - release-candidate
          - developer-verification

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out candidate revision
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Validate build purpose
        env:
          PURPOSE: ${{ inputs.purpose }}
        run: |
          case "$PURPOSE" in
            release-candidate|developer-verification) ;;
            *) echo "Unsupported build purpose" >&2; exit 1 ;;
          esac

      - name: Test
        run: ./gradlew --no-daemon testFiveDebugUnitTest

      - name: Add developer verification registration
        if: inputs.purpose == 'developer-verification'
        env:
          ADI_REGISTRATION: ${{ secrets.BLOKADA5_ADI_REGISTRATION }}
        run: |
          set -euo pipefail
          if [ -z "$ADI_REGISTRATION" ]; then
            echo "Missing required GitHub Actions secret: BLOKADA5_ADI_REGISTRATION" >&2
            exit 1
          fi
          mkdir -p app/src/main/assets
          printf '%s\n' "$ADI_REGISTRATION" > app/src/main/assets/adi-registration.properties

      - name: Build unsigned release APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleFiveRelease

          mapfile -t apks < <(find app/build/outputs/apk/five/release -maxdepth 1 -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "Android SDK apksigner is unavailable" >&2
            exit 1
          fi
          if "$apksigner" verify "${apks[0]}" >/dev/null 2>&1; then
            echo "Build unexpectedly produced a signed APK" >&2
            exit 1
          fi
          cp "${apks[0]}" unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-apk
          path: unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove developer verification registration
        if: always()
        run: rm -f app/src/main/assets/adi-registration.properties

  sign:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Download unsigned APK
        uses: actions/download-artifact@v8
        with:
          name: unsigned-apk

      - name: Sign release APK
        env:
          BLOKADA5_KEYSTORE_BASE64: ${{ secrets.BLOKADA5_KEYSTORE_BASE64 }}
          BLOKADA5_KEYSTORE_PWD: ${{ secrets.BLOKADA5_KEYSTORE_PWD }}
          BLOKADA5_KEY_PWD: ${{ secrets.BLOKADA5_KEY_PWD }}
        run: |
          set -euo pipefail
          for name in BLOKADA5_KEYSTORE_BASE64 BLOKADA5_KEYSTORE_PWD BLOKADA5_KEY_PWD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/blokada5.jks"
          printf '%s' "$BLOKADA5_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "Android SDK apksigner is unavailable" >&2
            exit 1
          fi
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias blokada \
            --ks-pass env:BLOKADA5_KEYSTORE_PWD \
            --key-pass env:BLOKADA5_KEY_PWD \
            --out signed.apk \
            unsigned.apk

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/blokada5.jks"

      - name: Verify release APK
        id: verify
        env:
          EXPECTED_CERT_SHA256: 96fc668a9f97f3369f9803b4af0af0b29ae06ce27bce22cef40cc44d0c433af9
          EXPECTED_PACKAGE: org.blokada.origin.alarm
          PURPOSE: ${{ inputs.purpose }}
        run: |
          set -euo pipefail

          apk="signed.apk"

          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$apksigner" ] || [ -z "$aapt" ]; then
            echo "Android SDK verification tools are unavailable" >&2
            exit 1
          fi

          "$apksigner" verify --verbose --print-certs "$apk" | tee signing-report.txt
          actual_cert="$($apksigner verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Unexpected signing certificate: $actual_cert" >&2
            exit 1
          fi

          badging="$($aapt dump badging "$apk" | head -1)"
          actual_package="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
          if [ "$actual_package" != "$EXPECTED_PACKAGE" ]; then
            echo "Unexpected package: $actual_package" >&2
            exit 1
          fi

          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
          unzip -Z1 "$apk" > apk-entries.txt
          if [ "$PURPOSE" = "developer-verification" ]; then
            if ! grep -Fxq 'assets/adi-registration.properties' apk-entries.txt; then
              echo "Developer verification registration is missing from the APK" >&2
              exit 1
            fi
            output="PLAY-CONSOLE-ONLY-blokada5-${GITHUB_SHA:0:12}.apk"
          else
            if grep -Fxq 'assets/adi-registration.properties' apk-entries.txt; then
              echo "Developer verification registration must not be included in a release candidate" >&2
              exit 1
            fi
            output="blokada5-${version_name}-${GITHUB_SHA:0:12}.apk"
          fi
          cp "$apk" "$output"
          sha256sum "$output" > "$output.sha256"

          echo "apk=$output" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Upload signed candidate
        uses: actions/upload-artifact@v7
        with:
          name: blokada5-${{ inputs.purpose }}-${{ github.run_id }}
          path: |
            ${{ steps.verify.outputs.apk }}
            ${{ steps.verify.outputs.apk }}.sha256
            signing-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Summarize candidate
        env:
          PURPOSE: ${{ inputs.purpose }}
        run: |
          {
            echo "### Signed candidate"
            echo "- Purpose: \`$PURPOSE\`"
            echo "- Version: \`${{ steps.verify.outputs.version_name }}\`"
            echo "- Version code: \`${{ steps.verify.outputs.version_code }}\`"
            echo "- Source commit: \`${{ github.sha }}\`"
            echo "- Artifact: \`blokada5-$PURPOSE-$GITHUB_RUN_ID\`"
            echo ""
            if [ "$PURPOSE" = "developer-verification" ]; then
              echo "Upload this APK only to Play Console for package ownership verification. Do not distribute it."
            else
              echo "Test this APK before creating a version tag or GitHub Release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
